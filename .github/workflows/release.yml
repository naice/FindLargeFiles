name: Release

# Every push to main builds, tests and publishes a downloadable release.
# Version: major.minor from <Version> in src/FindLargeFiles/FindLargeFiles.csproj, patch = workflow run number.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create tags and releases

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/FindLargeFiles/FindLargeFiles.csproj
          $base = [version]($project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          $version = "$($base.Major).$($base.Minor).${{ github.run_number }}"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version"

      - name: Restore
        run: dotnet restore FindLargeFiles.slnx

      - name: Test
        run: dotnet test FindLargeFiles.slnx --configuration Release --no-restore

      - name: Publish
        run: >
          dotnet publish src/FindLargeFiles/FindLargeFiles.csproj
          --configuration Release
          --output publish
          -p:Version=${{ steps.version.outputs.version }}
          -p:DebugType=none

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = "dist/FindLargeFiles-$version-win-x64.exe"
          $zip = "dist/FindLargeFiles-$version-win-x64.zip"
          Copy-Item publish/FindLargeFiles.exe $exe
          Compress-Archive -Path publish/FindLargeFiles.exe, LICENSE.md, README.md -DestinationPath $zip
          Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $notes = @"
          ## Download

          - **FindLargeFiles-${{ steps.version.outputs.version }}-win-x64.exe** – single file, no installation or .NET runtime required (Windows 10/11, x64)
          - **…zip** – the same executable together with README and license
          - **SHA256SUMS.txt** – checksums for verification

          Built from ${{ github.sha }}.
          "@
          gh release create $tag (Get-ChildItem dist -File).FullName `
            --target "${{ github.sha }}" `
            --title "FindLargeFiles ${{ steps.version.outputs.version }}" `
            --notes $notes `
            --generate-notes `
            --latest
